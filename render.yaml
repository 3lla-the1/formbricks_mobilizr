services:
  formbricks:
    type: web
    name: formbricks_mobilizr
    env: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formbricks-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

  postgres:
    type: pserv
    name: formbricks-db
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: pgvector/pgvector:pg17
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgres

  redis:
    type: pserv
    name: redis
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: redis:7.0.11
    plan: free
    envVars: []

  mailhog:
    type: pserv
    name: mailhog
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: arjenz/mailhog
    plan: free
    envVars: []

  minio:
    type: pserv
    name: minio
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    plan: free
    envVars:
      - key: MINIO_ROOT_USER
        value: devminio
      - key: MINIO_ROOT_PASSWORD
        value: devminio123
    startCommand: "server /data --console-address ':9001'"
