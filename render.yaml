services:
  formbricks:
    type: web
    name: formbricks_mobilizr
    env: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formbricks-db
          property: connectionString
        build: true
      - key: NEXTAUTH_SECRET
        value: 9e96d2f0f4ab9d4cca3623a9997992af8f0c86e7858cdbc2797f7809cfd84470
        build: true
      - key: NEXTAUTH_URL
        value: https://formbricks-mobilizr.onrender.com
        build: true
      - key: ENCRYPTION_KEY
        value: 70752bc3c99afffed475c3258b315c50e67646aebfe3d312af5abebcd8e2860d
        build: true

  postgres:
    type: pserv
    name: formbricks-db
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: pgvector/pgvector:pg17
    plan: free
    envVars:
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        value: postgres

  redis:
    type: pserv
    name: redis
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: redis:7.0.11
    plan: free
    envVars: []

  mailhog:
    type: pserv
    name: mailhog
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: arjenz/mailhog
    plan: free
    envVars: []

  minio:
    type: pserv
    name: minio
    env: docker
    dockerfilePath: null
    dockerContext: null
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    plan: free
    envVars:
      - key: MINIO_ROOT_USER
        value: devminio
      - key: MINIO_ROOT_PASSWORD
        value: devminio123
    startCommand: "server /data --console-address ':9001'"
